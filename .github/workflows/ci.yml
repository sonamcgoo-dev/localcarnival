name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Verify CLI binary
        run: |
          chmod +x packages/cli/bin/circus.js
          node packages/cli/bin/circus.js --version
        
  validate-specs:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Validate LCA specs
        run: |
          echo "Validating LocalCircus Architecture specifications..."
          for spec in localcircus-specs/*.md; do
            # Skip README.md
            if [[ "$spec" == *"README.md" ]]; then
              echo "Skipping $spec..."
              continue
            fi
            echo "Checking $spec..."
            # Basic validation checks
            head -1 "$spec" | grep -q "^# LCA-" || { echo "Missing LCA header"; exit 1; }
            grep -q "Status:" "$spec" || { echo "Missing Status"; exit 1; }
            grep -q "Version:" "$spec" || { echo "Missing Version"; exit 1; }
          done
          echo "All specs validated!"
          
      - name: CLI smoke test
        run: |
          node packages/cli/bin/circus.js --help
          node packages/cli/bin/circus.js status
