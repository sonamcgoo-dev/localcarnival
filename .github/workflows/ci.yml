name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint || true
        
      - name: Build
        run: npm run build
        continue-on-error: true
        
  test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm run test || true
        
  validate-specs:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Validate LCA specs
        run: |
          echo "Validating LocalCircus Architecture specifications..."
          for spec in localcircus-specs/*.md; do
            echo "Checking $spec..."
            # Basic validation checks
            head -1 "$spec" | grep -q "^# LCA-" || { echo "Missing LCA header"; exit 1; }
            grep -q "Status:" "$spec" || { echo "Missing Status"; exit 1; }
            grep -q "Version:" "$spec" || { echo "Missing Version"; exit 1; }
          done
          echo "All specs validated!"
